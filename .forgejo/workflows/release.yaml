on:
  push:
    tags:
      - "*"
jobs:
  build:
    runs-on: docker
    steps:
      - name: Check out the tag
        uses: actions/checkout@v4
      - name: Setup buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: git.bs.informatik.uni-siegen.de
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            git.bs.informatik.uni-siegen.de/${{ env.GITHUB_REPOSITORY }}:latest
            git.bs.informatik.uni-siegen.de/${{ env.GITHUB_REPOSITORY }}:${{ env.GITHUB_REF_NAME }}